services:

  api:
    build: .
    container_name: opsboard-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://opsboard:opsboard@postgres:5432/opsboard
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: opsboard
      POSTGRES_PASSWORD: opsboard
      POSTGRES_DB: opsboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsboard -d opsboard"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: opsboard_test
    ports:
      - "5433:5432"