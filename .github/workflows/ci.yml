name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: opsboard_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d opsboard"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Dependency security scan
        run: pip-audit
      
      - name: Build Docker image
        run: docker build -t opsboard:${{ github.sha }} .

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: opsboard:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"